name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  ui-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui-tokens && pnpm check:ui-catalog
      - run: pnpm build:ui-candidate && pnpm build:ui-preview && pnpm build:ui-trial && pnpm build:storybook
      - run: pnpm check:ui-boundaries
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Isolated component review in Chromium and WebKit
        run: pnpm test:e2e:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-review-results
          path: output/ui-tests/
          if-no-files-found: ignore
          retention-days: 7
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Native workerd Web and OAuth MCP UI acceptance
        run: pnpm cf:test:browser
      - name: WebKit responsive and offline acceptance
        run: node scripts/cloudflare/browser.mjs --grep 'Ant Design|Impeccable|six distinct items|Chinese composition Enter' --output output/playwright/webkit-results
        env:
          ACORNARY_E2E_BROWSER: webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-browser-results
          path: output/playwright/
          retention-days: 7
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install independent preview signing key
        env:
          PREVIEW_KEYSTORE: ${{ secrets.CF_PREVIEW_ANDROID_KEYSTORE }}
          PREVIEW_PASSWORD: ${{ secrets.CF_PREVIEW_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE" ]; then
            umask 077
            printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cf-preview.jks"
            printf 'ACORNARY_CF_ANDROID_KEYSTORE=%s\n' "$RUNNER_TEMP/cf-preview.jks" >> "$GITHUB_ENV"
            printf 'ACORNARY_CF_ANDROID_KEY_PASSWORD=%s\n' "$PREVIEW_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build, lint and unit tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleCfPreview :app:lintCfPreview :aod:assembleDebug :overlay:assembleDebug :app:lintDebug :aod:lintDebug :app:testDebugUnitTest :aod:testDebugUnitTest
      - name: Verify preview APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apps/android/app/build/outputs/apk/cfPreview/app-cfPreview.apk > apps/android/app/build/outputs/apk/cfPreview/signature.txt
          if [ -n "$ACORNARY_CF_ANDROID_KEYSTORE" ]; then
            python3 - <<'PY'
          from pathlib import Path
          report = Path('apps/android/app/build/outputs/apk/cfPreview/signature.txt').read_text().lower()
          expected = 'ddffd0887890c282a92eaca037f9cd60cc661df4b4e398aa1b2aa1a039e64cec'
          assert 'signer #1 certificate sha-256 digest: ' + expected in report
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acornary-cf-preview-apk
          path: apps/android/app/build/outputs/apk/cfPreview/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: apps/android
          script: bash tools/verify-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          path: |
            apps/android/app/build/reports/
            apps/android/aod/build/reports/
            apps/android/app/build/outputs/androidTest-results/
            output/android-design/
          retention-days: 7
