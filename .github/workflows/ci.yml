name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Deployment controller tests
        run: python3 -m unittest discover -s tests/deploy -v
      - name: Build isolated test runtime
        run: docker build --target browser-test -t acornary-ci .
      - name: Types, PostgreSQL, OAuth, build and browser tests
        run: node scripts/ci.mjs
      - name: Build release recovery fixture
        run: docker build --target runtime -t acornary-release-fixture:base --build-arg VERSION=v9.0.0 --build-arg COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa .
      - name: Real PostgreSQL migration and application recovery
        run: python3 tests/deploy/real_containers.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-browser-results
          path: output/ci/
          retention-days: 7
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, lint and unit tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :aod:assembleDebug :overlay:assembleDebug :app:lintDebug :aod:lintDebug :app:testDebugUnitTest :aod:testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          path: |
            apps/android/app/build/reports/
            apps/android/aod/build/reports/
            apps/android/app/build/outputs/androidTest-results/
          retention-days: 7
