name: Cloudflare migration checks
on:
  push:
    branches: [codex/cloudflare-native]
  pull_request:
permissions:
  contents: read
jobs:
  native-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:contracts
      - run: pnpm cf:auth-schema
      - run: pnpm cf:typecheck
      - run: pnpm cf:test:kernel
      - run: pnpm cf:test:inventory
      - run: pnpm cf:test:auth
      - run: pnpm cf:test:http
      - run: pnpm cf:test:snapshot
      - run: pnpm cf:test:backup
  deploy-preview:
    needs: native-kernel
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/cloudflare-native' && vars.CF_PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: cloudflare-preview
      url: https://cf.acornary.protium.top
    concurrency:
      group: acornary-cloudflare-preview
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require full CI for this commit
        run: node scripts/cloudflare/wait-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy isolated native preview
        run: pnpm cf:deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloudflare-preview-release
          path: output/cloudflare-release/manifest.json
          if-no-files-found: ignore
          retention-days: 30
